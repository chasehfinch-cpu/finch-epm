[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finch-epm"
version = "0.5.0"
description = "Local-first portable analytics layer for EPM and database systems. Connect to NetSuite, SQL Server, PostgreSQL, Snowflake, BigQuery, or any ODBC source. Cache data locally. Share dashboards as portable .fdash files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Chase Finch" },
]
keywords = [
    "analytics", "bi", "business-intelligence", "dashboard", "epm",
    "finance", "netsuite", "reporting", "sql-server", "duckdb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.0",
    "click>=8.1",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "sqlglot>=23.0",
]

[project.urls]
Homepage = "https://github.com/chasehfinch-cpu/finch-epm"
Repository = "https://github.com/chasehfinch-cpu/finch-epm"
Documentation = "https://github.com/chasehfinch-cpu/finch-epm/blob/main/GETTING_STARTED.md"
Issues = "https://github.com/chasehfinch-cpu/finch-epm/issues"
Changelog = "https://github.com/chasehfinch-cpu/finch-epm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
postgres = ["psycopg2-binary>=2.9"]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0"]
odbc = ["pyodbc>=5.0"]
mcp = ["mcp>=1.0"]
all = [
    "pyodbc>=5.0",
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "openpyxl>=3.1",
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
finch-epm = "finch_epm.cli.main:cli"

[project.entry-points."finch_epm.connectors"]
# Third-party connector packages register here.
# Example: oracle = "finch_epm_oracle:OracleConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/finch_epm"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# F821: false positives with `from __future__ import annotations` and late imports
# F401: unused imports are often intentional (re-exports, type-only imports in CLI)
# F541: f-strings without placeholders in click.echo are harmless readability choice
# F841: unused variables from API calls we don't consume yet
# E402: module-level imports after logger setup is an intentional pattern
# E741: single-letter variables in list comprehensions are clear in context
ignore = ["F821", "F401", "F541", "F841", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
