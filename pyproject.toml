[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finch-epm"
version = "0.3.0"
description = "Local-first portable analytics layer for EPM and database systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "click>=8.1",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
sqlserver = [
    "pyodbc>=5.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]
snowflake = [
    "snowflake-connector-python>=3.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
]
odbc = [
    "pyodbc>=5.0",
]
all = [
    "pyodbc>=5.0",
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
finch-epm = "finch_epm.cli.main:cli"

[project.entry-points."finch_epm.connectors"]
# Third-party connector packages register here.
# Example: oracle = "finch_epm_oracle:OracleConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/finch_epm"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
