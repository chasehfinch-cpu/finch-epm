<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>finch-epm</title>
<style id="base-css">
/* ── Reset & base ────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fdash-font-family,'Segoe UI',Tahoma,Geneva,Verdana,sans-serif);background:var(--fdash-bg-page,#eef1f5);color:var(--fdash-text-primary,#1a1a2e);font-size:14px}

/* ── Print ───────────────────────────────────────────────── */
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .report-header,.card{box-shadow:none}
  th,td,.row-level5,.row-level4,.row-level3,.row-level2,.row-level1,.row-ebitda,.row-netincome,.row-stats-header{
    print-color-adjust:exact;-webkit-print-color-adjust:exact;
  }
}
@page{margin:0.5in;size:landscape}

/* ── Report header ───────────────────────────────────────── */
.report-header{
  background:var(--fdash-header-bg,linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%));
  color:var(--fdash-header-text,#fff);padding:24px 32px;border-radius:0 0 8px 8px;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
}
.report-title{font-size:22pt;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
.report-subtitle{font-size:12pt;opacity:0.95;margin-bottom:16px}
.report-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.3)}
.meta-item{font-size:9pt}
.meta-label{opacity:0.85;font-weight:400;margin-bottom:2px}
.meta-value{font-weight:600;font-size:10pt}

/* ── Warnings banner ─────────────────────────────────────── */
.warning-banner{background:#fffbeb;border:1px solid #fde68a;padding:8px 20px;font-size:12px;color:#92400e;display:flex;align-items:center;gap:8px}
.warning-banner:empty{display:none}
.sync-banner{background:#eff6ff;border:1px solid #bfdbfe;padding:10px 20px;font-size:13px;color:#1e40af;display:flex;align-items:center;gap:10px}
.sync-banner:empty{display:none}
.sync-spinner{width:14px;height:14px;border:2px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite}

/* Toggle filter buttons */
.toggle-group{display:flex;background:#f1f5f9;border-radius:8px;padding:3px;gap:2px}
.toggle-btn{padding:6px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;color:#64748b;background:transparent;transition:all 0.18s;white-space:nowrap}
.toggle-btn.active{background:#fff;color:var(--fdash-table-header-bg,#1e3a8a);box-shadow:0 1px 4px rgba(0,0,0,0.12);font-weight:600}
.toggle-btn:hover:not(.active){color:#334155;background:rgba(255,255,255,0.5)}

/* Drill-down panel */
.drill-panel{position:fixed;right:20px;top:80px;width:520px;max-height:calc(100vh - 120px);background:var(--fdash-bg-card,#fff);border:1px solid var(--fdash-border,#e4e7ec);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:100;display:none;flex-direction:column;overflow:hidden}
.drill-panel.open{display:flex}
.drill-panel-header{background:var(--fdash-header-bg,linear-gradient(135deg,#1e3a8a,#2563eb));color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:move}
.drill-panel-header h3{font-size:14px;font-weight:600;margin:0}
.drill-panel-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px;opacity:0.8}
.drill-panel-close:hover{opacity:1}
.drill-panel-body{overflow:auto;flex:1;padding:0}
.drill-panel-body table.dt{font-size:9pt}
.drill-panel-body table.dt th{font-size:8pt;padding:8px 6px}
.drill-panel-body table.dt td{padding:4px 6px}

/* Dashboard table (P&L matrix) overrides */
.dashboard-table td.col-account{text-align:left;position:sticky;left:0;z-index:5;background:var(--fdash-bg-card,#fff);font-weight:500;min-width:280px}
.dashboard-table th.col-account{text-align:left;position:sticky;left:0;z-index:11;min-width:280px}
.dashboard-table th.col-month{min-width:100px;text-align:center}
.dashboard-table td.col-number{text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Filter toolbar ──────────────────────────────────────── */
.filter-toolbar{
  background:var(--fdash-filter-bg,#fff);border:var(--fdash-filter-border,2px solid #dbeafe);
  border-radius:var(--fdash-filter-radius,8px);padding:10px 14px;margin:16px 20px 0;
  display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
}
.filter-toolbar:empty{display:none}
.ft-group{display:flex;flex-direction:column;gap:4px}
.ft-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--fdash-filter-label-color,#6b7280)}
.ft-select{
  height:var(--fdash-filter-input-height,32px);padding:0 8px;border:1px solid #d1d5db;
  border-radius:4px;font-size:13px;background:#fff;color:#111827;cursor:pointer;min-width:120px;
}
.ft-select:focus{outline:none;border-color:var(--fdash-accent,#3b82f6);box-shadow:0 0 0 2px rgba(59,130,246,0.15)}
.ft-btn{
  height:32px;padding:0 18px;border:none;border-radius:4px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background 0.15s;
}
.ft-btn-primary{background:var(--fdash-table-header-bg,#1e3a8a);color:#fff}
.ft-btn-primary:hover{filter:brightness(0.9)}
.ft-btn-export{background:var(--fdash-success,#059669);color:#fff}
.ft-btn-export:hover{filter:brightness(0.9)}
.ft-btn-secondary{background:#e5e7eb;color:#374151}
.ft-btn-secondary:hover{background:#d1d5db}
.cross-filter-badge{display:inline-block;background:var(--fdash-accent,#2563eb);color:#fff;font-size:10px;padding:2px 10px;border-radius:10px;margin-left:8px;cursor:pointer;font-weight:500}
.cross-filter-badge:hover{background:var(--fdash-danger,#dc2626)}

/* ── Tab bar ─────────────────────────────────────────────── */
.tab-bar{background:var(--fdash-bg-card,#fff);border:2px solid #e5e7eb;border-radius:8px;overflow:hidden;margin:16px 20px 0;display:flex}
.tab-bar:empty{display:none}
.tab-btn{padding:12px 24px;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;font-size:13px;font-weight:500;color:var(--fdash-text-muted,#6b7280);white-space:nowrap;transition:all 0.2s}
.tab-btn:hover{background-color:var(--fdash-tab-hover-bg,#f3f4f6)}
.tab-btn.active{border-bottom-color:var(--fdash-tab-active-border,#2563eb);background-color:var(--fdash-tab-active-bg,#eff6ff);color:var(--fdash-tab-active-text,#2563eb);font-weight:600}

/* ── Chart grid ──────────────────────────────────────────── */
.grid{display:flex;flex-wrap:wrap;gap:14px;padding:16px 20px}
.card{background:var(--fdash-bg-card,#fff);border-radius:var(--fdash-card-radius,6px);box-shadow:var(--fdash-card-shadow,0 1px 4px rgba(0,0,0,0.06));overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--fdash-border,#e4e7ec)}
.card-full{flex:1 1 100%}
.card-half{flex:1 1 calc(50% - 7px);min-width:380px}
.card-third{flex:1 1 calc(33.333% - 10px);min-width:280px}
.card-quarter{flex:1 1 calc(25% - 11px);min-width:200px}
.card-kpi{flex:0 0 auto;min-width:170px;max-width:240px}
.card-header{padding:12px 16px 6px;font-size:13px;font-weight:600;color:var(--fdash-text-secondary,#374151);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.export-btn{font-size:10px;color:#9ca3af;cursor:pointer;padding:2px 8px;border:1px solid #e5e7eb;border-radius:3px;background:#fafafa;text-decoration:none;font-weight:500}
.export-btn:hover{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.chart-container{width:100%;height:360px;padding:4px 8px 8px}

/* ── KPI / stat cards ────────────────────────────────────── */
.kpi-body{padding:14px 20px;text-align:center}
.kpi-value{font-size:var(--fdash-kpi-value-size,22px);font-weight:700;color:var(--fdash-kpi-value-color,#1e3a8a);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--fdash-kpi-label-color,#94a3b8);margin-top:4px}
.kpi-delta{font-size:12px;margin-top:2px;font-weight:600}
.kpi-delta.favorable{color:var(--fdash-success,#059669)}
.kpi-delta.unfavorable{color:var(--fdash-danger,#dc2626)}
.kpi-sub{font-size:12px;color:var(--fdash-text-muted,#64748b);margin-top:2px}

/* ── Data tables ─────────────────────────────────────────── */
.table-wrap{overflow:auto;max-height:70vh;position:relative;border-radius:6px}
table.dt{width:100%;border-collapse:collapse;font-family:var(--fdash-font-family,'Segoe UI',Tahoma,Geneva,Verdana,sans-serif);font-size:var(--fdash-table-font-size,10pt);line-height:1.3}
table.dt th{
  background-color:var(--fdash-table-header-bg,#1e3a8a);color:var(--fdash-table-header-text,#fff);
  padding:12px 8px;text-align:center;font-weight:700;font-size:9pt;
  border:1px solid var(--fdash-table-header-border,#1e40af);position:sticky;top:0;z-index:10;white-space:nowrap;
}
table.dt th.col-left{text-align:left;min-width:280px;position:sticky;left:0;z-index:11}
table.dt th.col-total{background-color:var(--fdash-accent,#2563eb);font-weight:800}
table.dt td{padding:6px 8px;border:1px solid var(--fdash-table-border,#e5e7eb);font-size:9pt}
table.dt td.col-left{text-align:left;position:sticky;left:0;z-index:5;background:var(--fdash-bg-card,#fff);font-weight:500}
table.dt td.col-number{text-align:right;padding-right:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt td.col-total{background-color:#eff6ff;font-weight:700;color:#1e40af;text-align:right;padding-right:12px}
table.dt tr:hover td{background:var(--fdash-table-row-hover,rgba(59,130,246,0.1)) !important}
table.dt tr:nth-child(even) td{background:var(--fdash-table-row-even,#f9fafb)}
table.dt tr:nth-child(even) td.col-left{background:var(--fdash-table-row-even,#f9fafb)}

/* ── Variance coloring ───────────────────────────────────── */
.col-variance-fav{color:var(--fdash-success,#059669);font-weight:600}
.col-variance-unfav{color:var(--fdash-danger,#dc2626);font-weight:600}

/* ── P&L hierarchy rows ──────────────────────────────────── */
.row-level5{background-color:#1e3a8a;color:#fff;font-weight:700;font-size:10.5pt}
.row-level5 td.col-left{background-color:#1e3a8a;color:#fff}
.row-level5 td.col-total{background-color:#2563eb;color:#fff}
.row-level5 .col-variance-fav,.row-level5 .col-variance-unfav{color:#fff}
.row-level4{background-color:#2563eb;color:#fff;font-weight:700}
.row-level4 td.col-left{background-color:#2563eb;color:#fff}
.row-level4 td.col-total{background-color:#3b82f6;color:#fff}
.row-level4 .col-variance-fav,.row-level4 .col-variance-unfav{color:#fff}
.row-level3{background-color:#3b82f6;color:#fff;font-weight:700}
.row-level3 td.col-left{background-color:#3b82f6;color:#fff}
.row-level3 td.col-total{background-color:#60a5fa;color:#1e3a8a}
.row-level3 .col-variance-fav,.row-level3 .col-variance-unfav{color:#fff}
.row-level2{background-color:#60a5fa;color:#1e3a8a;font-weight:700}
.row-level2 td.col-left{background-color:#60a5fa}
.row-level2 td.col-total{background-color:#93c5fd;color:#1e3a8a}
.row-level1{background-color:#93c5fd;color:#1e3a8a;font-weight:600}
.row-level1 td.col-left{background-color:#93c5fd}
.row-level1 td.col-total{background-color:#bfdbfe;color:#1e3a8a}
.row-ebitda{background-color:#059669;color:#fff;font-weight:700;font-size:10.5pt}
.row-ebitda td.col-left{background-color:#059669;color:#fff}
.row-ebitda td.col-total{background-color:#047857;color:#fff}
.row-ebitda .col-variance-fav,.row-ebitda .col-variance-unfav{color:#fff}
.row-netincome{background-color:#0891b2;color:#fff;font-weight:700;font-size:11pt}
.row-netincome td.col-left{background-color:#0891b2;color:#fff}
.row-netincome td.col-total{background-color:#0e7490;color:#fff}
.row-netincome .col-variance-fav,.row-netincome .col-variance-unfav{color:#fff}
.row-stats-header{background-color:#4b5563;color:#fff;font-weight:700;font-size:10.5pt}
.row-stats-header td.col-left{background-color:#4b5563;color:#fff}
.row-stats-header td.col-total{background-color:#374151;color:#fff}
.row-stat{background-color:#f9fafb}
.row-stat:nth-child(even){background-color:#f3f4f6}
.row-stat td.col-left{font-weight:600;color:#374151}
.row-account:nth-child(even){background-color:#f9fafb}

/* ── Indentation ─────────────────────────────────────────── */
.indent-0{padding-left:8px !important}.indent-1{padding-left:24px !important}.indent-2{padding-left:40px !important}
.indent-3{padding-left:56px !important}.indent-4{padding-left:72px !important}.indent-5{padding-left:88px !important}
.indent-6{padding-left:104px !important}.indent-7{padding-left:120px !important}

/* ── Expand/collapse ─────────────────────────────────────── */
.expandable{cursor:pointer;user-select:none}
.expandable:hover{opacity:0.9}
.expand-icon{display:inline-block;width:14px;text-align:center;font-weight:bold;margin-right:6px;font-size:9pt;transition:transform 0.2s}
.clickable-row{cursor:pointer;transition:background-color 0.15s}
tr.hidden{display:none}

/* ── Error / empty states ────────────────────────────────── */
.error{color:#92400e;background:#fffbeb;border:1px solid #fde68a;padding:12px 16px;font-size:12px;margin:8px;border-radius:4px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;border:2px dashed #d1d5db;border-radius:8px;margin:20px;color:#9ca3af;text-align:center;padding:32px}
.empty-state-icon{font-size:48px;opacity:0.3;margin-bottom:16px}
.empty-state-title{font-size:16px;font-weight:600;color:#374151;margin-bottom:8px}
.empty-state-desc{font-size:13px;color:#6b7280;max-width:400px}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:900px){
  .card-half,.card-third{flex:1 1 100%;min-width:0}
  .card-kpi,.card-quarter{flex:1 1 calc(50% - 8px);max-width:none}
}
</style>
<style id="theme-css"></style>
<style id="custom-css"></style>
</head>
<body>

<!-- Brand header (populated from spec.brand) -->
<div id="brand-header" style="display:none"></div>

<!-- Report header -->
<div class="report-header no-print">
  <div class="report-title" id="dash-title">Loading...</div>
  <div class="report-subtitle" id="dash-desc"></div>
  <div class="report-meta" id="dash-meta">
    <div class="meta-item"><div class="meta-label">Source</div><div class="meta-value" id="meta-source">-</div></div>
    <div class="meta-item"><div class="meta-label">Data freshness</div><div class="meta-value" id="global-staleness">-</div></div>
  </div>
</div>

<!-- Warnings (unclassified items, etc.) -->
<div class="sync-banner no-print" id="sync-banner"></div>
<div class="warning-banner no-print" id="warning-banner"></div>

<!-- Tab bar -->
<div class="tab-bar no-print" id="tab-bar"></div>

<!-- Filter toolbar -->
<div class="filter-toolbar no-print" id="filter-bar"></div>

<!-- Chart grid -->
<div class="grid" id="chart-grid"></div>

<script src="/static/echarts.min.js"></script>
<script src="/static/vega.min.js"></script>
<script src="/static/vega-lite.min.js"></script>
<script src="/static/vega-embed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
(function() {
  "use strict";

  var PALETTE = ["#1e3a8a","#2563eb","#3b82f6","#059669","#f59e0b","#dc2626","#0891b2","#9333ea"];
  var dashSpec = null;
  var queryData = {};
  var echartInstances = [];
  var activeFilters = {};
  var activePage = 0;

  function init() {
    fetch("/api/dashboard").then(function(r){return r.json();}).then(function(spec) {
      dashSpec = spec;
      // Apply theme
      if (spec.theme_css) document.getElementById("theme-css").textContent = spec.theme_css;
      if (spec.custom_css) document.getElementById("custom-css").textContent = spec.custom_css;
      if (spec.chart_colors) PALETTE = spec.chart_colors;

      document.getElementById("dash-title").textContent = spec.name;
      document.getElementById("dash-desc").textContent = spec.description || "";
      document.title = spec.name + " - finch-epm";

      // Sources
      if (spec.sources && spec.sources.length) {
        document.getElementById("meta-source").textContent = spec.sources.join(", ");
      }

      // Brand
      if (spec.brand) buildBrand(spec.brand);

      // Warnings
      // Sync progress banner
      if (spec.sync_status && spec.sync_status.syncing) {
        var sb = document.getElementById("sync-banner");
        var rows = spec.sync_status.rows_so_far || 0;
        sb.innerHTML = '<div class="sync-spinner"></div>'
          + '<span><strong>Data sync in progress</strong> — '
          + spec.sync_status.progress
          + (rows > 0 ? ' (' + rows.toLocaleString() + ' rows so far)' : '')
          + '. Dashboard will update automatically when complete.</span>';
      } else {
        document.getElementById("sync-banner").innerHTML = '';
      }

      if (spec.warnings && spec.warnings.length) {
        document.getElementById("warning-banner").textContent = spec.warnings.join(" | ");
      }

      buildTabBar(spec);
      buildFilterBar(spec);
      loadAll(spec);
    });
  }

  function buildBrand(brand) {
    var el = document.getElementById("brand-header");
    if (!brand.company_name && !brand.logo) return;
    el.style.display = "flex";
    el.style.cssText = "display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--fdash-bg-card,#fff);border-bottom:1px solid var(--fdash-border,#e4e7ec)";
    if (brand.logo) {
      var img = document.createElement("img");
      img.src = brand.logo;
      img.style.height = "32px";
      img.alt = brand.company_name || "";
      el.appendChild(img);
    }
    if (brand.company_name) {
      var name = document.createElement("span");
      name.style.cssText = "font-size:14px;font-weight:600;color:var(--fdash-text-primary)";
      name.textContent = brand.company_name;
      el.appendChild(name);
    }
  }

  function buildTabBar(spec) {
    var bar = document.getElementById("tab-bar");
    bar.innerHTML = "";
    if (!spec.is_multi_page || !spec.pages || !spec.pages.length) return;
    spec.pages.forEach(function(page, idx) {
      var btn = document.createElement("button");
      btn.className = "tab-btn" + (idx === activePage ? " active" : "");
      btn.textContent = page.name;
      btn.addEventListener("click", function() {
        activePage = idx;
        bar.querySelectorAll(".tab-btn").forEach(function(b, i) {
          b.className = "tab-btn" + (i === idx ? " active" : "");
        });
        render(dashSpec);
      });
      bar.appendChild(btn);
    });
  }

  function buildFilterBar(spec) {
    var bar = document.getElementById("filter-bar");
    bar.innerHTML = "";
    if (!spec.filters || !spec.filters.length) return;
    spec.filters.forEach(function(f) {
      var group = document.createElement("div");
      group.className = "ft-group";
      var label = document.createElement("span");
      label.className = "ft-label";
      label.textContent = f.label;
      group.appendChild(label);

      // Toggle button filters
      if (f.type === "toggle") {
        var toggleGroup = document.createElement("div");
        toggleGroup.className = "toggle-group";
        // "All" button
        var allBtn = document.createElement("button");
        allBtn.className = "toggle-btn active";
        allBtn.textContent = "All";
        allBtn.addEventListener("click", function() {
          toggleGroup.querySelectorAll(".toggle-btn").forEach(function(b){b.classList.remove("active");});
          allBtn.classList.add("active");
          delete activeFilters[f.parameter];
          loadAll(dashSpec);
        });
        toggleGroup.appendChild(allBtn);
        // Load options
        fetch("/api/filter/" + encodeURIComponent(f.name))
          .then(function(r){return r.json();})
          .then(function(data) {
            if (data.options) {
              data.options.forEach(function(opt) {
                var btn = document.createElement("button");
                btn.className = "toggle-btn";
                btn.textContent = opt.label;
                if (f.default && String(opt.value) === String(f.default)) {
                  btn.classList.add("active");
                  allBtn.classList.remove("active");
                  activeFilters[f.parameter] = opt.value;
                }
                btn.addEventListener("click", function() {
                  toggleGroup.querySelectorAll(".toggle-btn").forEach(function(b){b.classList.remove("active");});
                  btn.classList.add("active");
                  activeFilters[f.parameter] = opt.value;
                  loadAll(dashSpec);
                });
                toggleGroup.appendChild(btn);
              });
            }
          });
        group.appendChild(toggleGroup);
      } else {
        // Standard dropdown filter
        var select = document.createElement("select");
        select.className = "ft-select";
        select.id = "filter-" + f.name;
        var allOpt = document.createElement("option");
        allOpt.value = "";
        allOpt.textContent = "All";
        select.appendChild(allOpt);
        fetch("/api/filter/" + encodeURIComponent(f.name))
          .then(function(r){return r.json();})
          .then(function(data) {
            if (data.options) {
              data.options.forEach(function(opt) {
                var o = document.createElement("option");
                o.value = opt.value; o.textContent = opt.label;
                if (f.default !== null && String(opt.value) === String(f.default)) o.selected = true;
                select.appendChild(o);
              });
            }
            if (f.default) activeFilters[f.parameter] = f.default;
          });
        select.addEventListener("change", function() {
          if (select.value) activeFilters[f.parameter] = select.value;
          else delete activeFilters[f.parameter];
          loadAll(dashSpec);
        });
        group.appendChild(select);
      }
      bar.appendChild(group);
    });
  }

  function buildQueryUrl(queryName) {
    var params = new URLSearchParams();
    for (var key in activeFilters) params.set(key, activeFilters[key]);
    var qs = params.toString();
    return "/api/query/" + encodeURIComponent(queryName) + (qs ? "?" + qs : "");
  }

  function loadAll(spec) {
    Promise.all(spec.queries.map(function(q) {
      return fetch(buildQueryUrl(q.name))
        .then(function(r){return r.json();})
        .then(function(d){queryData[q.name]=d;})
        .catch(function(e){queryData[q.name]={error:String(e)};});
    })).then(function(){ render(spec); updateStaleness(); });
  }

  function render(spec) {
    var grid = document.getElementById("chart-grid");
    grid.innerHTML = "";
    echartInstances = [];
    var deferred = [];
    var chartsToRender = spec.charts || [];
    if (spec.is_multi_page && spec.pages && spec.pages.length > 0) {
      var page = spec.pages[activePage] || spec.pages[0];
      chartsToRender = page.charts || [];
    }
    if (!chartsToRender.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128202;</div><div class="empty-state-title">No Charts Defined</div><div class="empty-state-desc">This dashboard has no charts to display. Add charts to your .fdash file.</div></div>';
      return;
    }
    chartsToRender.forEach(function(ch, idx) {
      var isKpi = ch.type === "kpi";
      var isMarkdown = ch.type === "markdown";
      var isTable = ch.type === "table" || ch.type === "pivot" || ch.type === "variance_table" || ch.type === "custom" || ch.type === "pl_matrix";
      var isEC = !isKpi && !isTable && !isMarkdown;
      var w = ch.width || (isKpi ? "kpi" : "half");
      var card = document.createElement("div");
      card.className = "card card-" + w;
      var hdr = document.createElement("div");
      hdr.className = "card-header";
      hdr.textContent = ch.title || ch.type;
      if (!isKpi && !isMarkdown) {
        var expBtn = document.createElement("a");
        expBtn.className = "export-btn";
        expBtn.textContent = "CSV";
        expBtn.href = "/api/export/" + encodeURIComponent(ch.data);
        expBtn.title = "Download as CSV";
        hdr.appendChild(expBtn);
        // Excel export (styled, with frozen panes)
        if (typeof ExcelJS !== "undefined") {
          var xlBtn = document.createElement("button");
          xlBtn.className = "export-btn";
          xlBtn.textContent = "Excel";
          xlBtn.title = "Download as styled Excel";
          xlBtn.style.marginLeft = "4px";
          xlBtn.addEventListener("click", function(){ exportExcel(ch, queryData[ch.data]); });
          hdr.appendChild(xlBtn);
        }
      }
      card.appendChild(hdr);
      var data = queryData[ch.data];
      if (!data || data.error) {
        renderError(card, data, ch);
      } else if (data.staleness && data.staleness.level === "missing" && data.row_count === 0) {
        var m = document.createElement("div");
        m.className = "error";
        m.style.color = "#996600";
        m.innerHTML = "Data not synced yet. Run:<br><code style='background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:12px'>finch-epm sync -c &lt;connector&gt; -p &lt;profile&gt; -t &lt;table&gt;</code>";
        card.appendChild(m);
      } else if (isKpi) {
        domRenderers.kpi(card, ch, data);
      } else if (isMarkdown) {
        domRenderers.markdown(card, ch, data);
      } else if (isTable) {
        domRenderers[ch.type](card, ch, data);
      } else if (isEC) {
        var c = document.createElement("div");
        c.className = "chart-container";
        c.id = "ec-" + idx;
        if (ch.height) c.style.height = ch.height + "px";
        card.appendChild(c);
        deferred.push({ch:ch, data:data, id:"ec-"+idx});
      }
      grid.appendChild(card);
    });
    requestAnimationFrame(function() {
      deferred.forEach(function(item) {
        var el = document.getElementById(item.id);
        if (el && el.offsetWidth > 0) {
          var ec = echarts.init(el);
          echartInstances.push(ec);
          ecBuilders[item.ch.type](ec, item.ch, item.data);
          if (item.ch.cross_filter) attachCrossFilter(ec, el, item.ch);
        }
      });
    });
  }

  function renderError(card, data, ch) {
    var e = document.createElement("div");
    e.className = "error";
    if (data && data.error_type === "missing_table") {
      e.style.color = "#996600";
      var tables = (data.missing_tables || []).join(", ");
      e.innerHTML = "<strong>Missing data</strong><br>This chart requires tables not in your local cache: <code>" + tables + "</code><br><span style='font-size:12px;color:#666'>" + (data.guidance || "Sync the required tables or check your access permissions.") + "</span>";
    } else if (data && data.error_type === "permission_denied") {
      e.style.color = "#cc3300";
      e.innerHTML = "<strong>Access denied</strong><br><span style='font-size:12px;color:#666'>" + (data.guidance || "You don't have permission to access the data this chart needs. Contact your administrator.") + "</span>";
    } else if (data && data.error_type === "missing_column") {
      e.style.color = "#996600";
      e.innerHTML = "<strong>Schema mismatch</strong><br><span style='font-size:12px;color:#666'>" + (data.guidance || "This chart references columns that don't exist in your data.") + "</span>";
    } else if (data && data.error_type === "query_error") {
      e.innerHTML = "<strong>Query error</strong><br><span style='font-size:12px;color:#666'>" + (data.guidance || data.error || "An error occurred.") + "</span>";
    } else {
      e.textContent = data ? data.error : "No data for query: " + ch.data;
    }
    card.appendChild(e);
  }

  function attachCrossFilter(ec, el, ch) {
    ec.on("click", function(params) {
      var cfCol = ch.cross_filter;
      var cfVal = params.name || params.value;
      if (cfVal) {
        activeFilters[cfCol] = cfVal;
        var hdr = el.parentElement.querySelector(".card-header");
        if (hdr) {
          var existing = hdr.querySelector(".cross-filter-badge");
          if (existing) existing.remove();
          var badge = document.createElement("span");
          badge.className = "cross-filter-badge";
          badge.textContent = cfCol + " = " + cfVal + " ×";
          badge.addEventListener("click", function(ev) {
            ev.stopPropagation();
            delete activeFilters[cfCol];
            badge.remove();
            loadAll(dashSpec);
          });
          hdr.appendChild(badge);
        }
        loadAll(dashSpec);
      }
    });
  }

  function updateStaleness() {
    var el = document.getElementById("global-staleness");
    var oldest = null, level = "fresh";
    for (var k in queryData) {
      var d = queryData[k];
      if (d && d.staleness) {
        if (d.staleness.level === "missing") level = "missing";
        else if (d.staleness.level === "stale" && level !== "missing") level = "stale";
        if (d.staleness.last_synced_at) {
          var ts = new Date(d.staleness.last_synced_at);
          if (!oldest || ts < oldest) oldest = ts;
        }
      }
    }
    var text = oldest ? oldest.toLocaleString() : "No data";
    if (level === "stale") text += " (stale)";
    if (level === "missing") text = "Some data missing";
    el.textContent = text;
    el.style.color = level === "missing" ? "#dc2626" : level === "stale" ? "#f59e0b" : "";
  }

  // -- Helpers --
  function col(data, name) { return data.column_names.indexOf(name); }
  function getColors(ch, count) {
    if (ch.colors && ch.colors.length) return ch.colors;
    if (ch.color) return [ch.color];
    return PALETTE.slice(0, count);
  }
  function yFields(ch) { var y = ch.y; return Array.isArray(y) ? y : (y ? [y] : []); }
  function fmtNum(v, fmt, prefix, suffix) {
    var n = Number(v);
    if (isNaN(n)) return String(v);
    prefix = prefix || ""; suffix = suffix || "";
    if (fmt === "currency") {
      if (Math.abs(n) >= 1e6) return prefix + (n/1e6).toFixed(1) + "M" + suffix;
      if (Math.abs(n) >= 1e3) return prefix + (n/1e3).toFixed(0) + "K" + suffix;
      return prefix + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + suffix;
    }
    if (fmt === "percent") return prefix + n.toLocaleString(undefined, {minimumFractionDigits:1, maximumFractionDigits:1}) + suffix;
    return prefix + n.toLocaleString(undefined, {maximumFractionDigits:2}) + suffix;
  }
  function fmtCurrency(n, prefix) {
    prefix = prefix || "$";
    if (Math.abs(n) >= 1e6) return prefix + (n/1e6).toFixed(1) + "M";
    if (Math.abs(n) >= 1e3) return prefix + (n/1e3).toFixed(0) + "K";
    return prefix + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtAxis(v) {
    var n = Number(v); if (isNaN(n)) return v;
    if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + "M";
    if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0) + "K";
    return n.toLocaleString();
  }

  // -- ECharts builders --
  var ecBuilders = {};
  function buildXYChart(type, ec, ch, data) {
    var xi = col(data, ch.x);
    var fields = yFields(ch);
    if (xi < 0 || !fields.length) return;
    var colors = getColors(ch, fields.length);
    var xData = data.rows.map(function(r){return r[xi];});
    var series = fields.map(function(f, i) {
      var yi = col(data, f);
      var s = {name:f, type:type==="area"?"line":type, data:data.rows.map(function(r){return Number(r[yi])||0;}), itemStyle:{color:colors[i%colors.length]}};
      if (type === "bar") { s.barMaxWidth = 50; s.itemStyle.borderRadius = [3,3,0,0]; }
      if (type === "line") { s.smooth = true; s.symbolSize = 5; s.lineStyle = {width:2}; }
      if (type === "area") { s.smooth = true; s.lineStyle = {width:2}; s.areaStyle = {opacity:0.15}; }
      return s;
    });
    var opt = {
      tooltip:{trigger:"axis",axisPointer:{type:type==="bar"?"shadow":"line"},backgroundColor:"#1f2937",borderColor:"#1f2937",textStyle:{color:"#f9fafb",fontSize:12}},
      xAxis:{type:"category",data:xData,axisLabel:{rotate:xData.length>8?35:0,fontSize:11,color:"#6b7280"},axisLine:{lineStyle:{color:"#e5e7eb"}}},
      yAxis:{type:"value",axisLabel:{fontSize:11,formatter:fmtAxis,color:"#6b7280"},splitLine:{lineStyle:{color:"#f3f4f6"}}},
      series:series,
      grid:{left:60,right:16,top:fields.length>1?36:16,bottom:xData.length>8?60:36}
    };
    if (fields.length > 1) opt.legend = {data:fields,top:0,textStyle:{fontSize:11}};
    ec.setOption(opt);
  }
  ecBuilders.bar = function(ec,ch,data){ buildXYChart("bar",ec,ch,data); };
  ecBuilders.line = function(ec,ch,data){ buildXYChart("line",ec,ch,data); };
  ecBuilders.area = function(ec,ch,data){ buildXYChart("area",ec,ch,data); };
  ecBuilders.scatter = function(ec, ch, data) {
    var xi = col(data, ch.x), yi = col(data, ch.y);
    if (xi<0||yi<0) return;
    var colors = getColors(ch, 1);
    ec.setOption({
      tooltip:{trigger:"item",backgroundColor:"#1f2937",borderColor:"#1f2937",textStyle:{color:"#f9fafb"}},
      xAxis:{type:"value",name:ch.x,nameLocation:"center",nameGap:28,axisLabel:{fontSize:11,color:"#6b7280"}},
      yAxis:{type:"value",name:ch.y,axisLabel:{fontSize:11,formatter:fmtAxis,color:"#6b7280"},splitLine:{lineStyle:{color:"#f3f4f6"}}},
      series:[{type:"scatter",data:data.rows.map(function(r){return[Number(r[xi])||0,Number(r[yi])||0];}),symbolSize:8,itemStyle:{color:colors[0],opacity:0.7}}],
      grid:{left:60,right:16,top:16,bottom:44}
    });
  };
  ecBuilders.timeseries = function(ec, ch, data) {
    var ti = col(data, ch.time);
    var fields = yFields(ch);
    if (ti<0||!fields.length) return;
    var colors = getColors(ch, fields.length);
    var series = fields.map(function(f,i) {
      var yi = col(data, f);
      return {name:f,type:"line",data:data.rows.map(function(r){return[r[ti],Number(r[yi])||0];}),smooth:true,symbolSize:4,lineStyle:{width:2},itemStyle:{color:colors[i%colors.length]}};
    });
    var opt = {
      tooltip:{trigger:"axis",backgroundColor:"#1f2937",borderColor:"#1f2937",textStyle:{color:"#f9fafb"}},
      xAxis:{type:"time",axisLabel:{fontSize:11,color:"#6b7280"}},
      yAxis:{type:"value",axisLabel:{fontSize:11,formatter:fmtAxis,color:"#6b7280"},splitLine:{lineStyle:{color:"#f3f4f6"}}},
      series:series,
      grid:{left:60,right:16,top:fields.length>1?36:16,bottom:36}
    };
    if (fields.length>1) opt.legend={data:fields,top:0,textStyle:{fontSize:11}};
    ec.setOption(opt);
  };

  // -- DOM renderers --
  var domRenderers = {};

  domRenderers.kpi = function(card, ch, data) {
    var vi = col(data, ch.value);
    if (vi<0||!data.rows.length){card.innerHTML+='<div class="error">No data</div>';return;}
    var val = data.rows[0][vi];
    var formatted = fmtNum(val, ch.format, ch.prefix, ch.suffix);
    var body = document.createElement("div");
    body.className = "kpi-body";
    var wrap = document.createElement("div");
    var vd = document.createElement("div");
    vd.className = "kpi-value";
    vd.textContent = formatted;
    if (ch.color) vd.style.color = ch.color;
    wrap.appendChild(vd);
    if (ch.label) {
      var ld = document.createElement("div");
      ld.className = "kpi-label";
      ld.textContent = ch.label;
      wrap.appendChild(ld);
    }
    // Delta / comparison
    if (ch.compare_value) {
      var cvi = col(data, ch.compare_value);
      if (cvi >= 0) {
        var cv = Number(data.rows[0][cvi]) || 0;
        var av = Number(val) || 0;
        var delta = av - cv;
        var pct = cv !== 0 ? ((delta / Math.abs(cv)) * 100).toFixed(1) : "0.0";
        var dd = document.createElement("div");
        dd.className = "kpi-delta " + (delta >= 0 ? "favorable" : "unfavorable");
        dd.textContent = (delta >= 0 ? "+" : "") + pct + "% vs " + (ch.compare_label || "prior");
        wrap.appendChild(dd);
      }
    }
    body.appendChild(wrap);
    card.appendChild(body);
  };

  domRenderers.markdown = function(card, ch, data) {
    var body = document.createElement("div");
    body.style.padding = "16px 20px";
    body.style.fontSize = "13px";
    body.style.lineHeight = "1.6";
    body.style.color = "var(--fdash-text-primary)";
    var content = ch.content || "";
    // Simple {{ query.column }} substitution
    content = content.replace(/\{\{\s*(\w+)\.(\w+)\s*\}\}/g, function(m, qname, cname) {
      var qd = queryData[qname];
      if (!qd || !qd.rows || !qd.rows.length) return "N/A";
      var ci = qd.column_names.indexOf(cname);
      if (ci < 0) return "N/A";
      var v = qd.rows[0][ci];
      return v !== null && v !== undefined ? String(v) : "N/A";
    });
    // Basic markdown: bold, italic, headers, line breaks
    content = content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    content = content.replace(/\*(.+?)\*/g, '<em>$1</em>');
    content = content.replace(/^### (.+)$/gm, '<h4 style="margin:12px 0 4px;font-size:14px">$1</h4>');
    content = content.replace(/^## (.+)$/gm, '<h3 style="margin:12px 0 6px;font-size:15px">$1</h3>');
    content = content.replace(/^# (.+)$/gm, '<h2 style="margin:12px 0 8px;font-size:16px">$1</h2>');
    content = content.replace(/\n/g, '<br>');
    body.innerHTML = content;
    card.appendChild(body);
  };

  domRenderers.table = function(card, ch, data) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    if (ch.height) wrap.style.maxHeight = ch.height + "px";
    if (!data.rows.length){wrap.innerHTML='<div class="error">No data</div>';card.appendChild(wrap);return;}
    var colFmt = ch.columns || {};
    var hasHierarchy = data.column_names.indexOf("_row_class") >= 0;
    var depthCol = data.column_names.indexOf("_depth");
    var rowClassCol = data.column_names.indexOf("_row_class");

    // Toolbar for hierarchical tables
    if (hasHierarchy) {
      var toolbar = document.createElement("div");
      toolbar.style.cssText = "padding:6px 12px;display:flex;gap:6px;border-bottom:1px solid #e5e7eb";
      var expandBtn = document.createElement("button");
      expandBtn.className = "ft-btn ft-btn-secondary";
      expandBtn.textContent = "Expand All";
      expandBtn.style.cssText = "font-size:11px;padding:4px 12px;height:28px";
      var collapseBtn = document.createElement("button");
      collapseBtn.className = "ft-btn ft-btn-secondary";
      collapseBtn.textContent = "Collapse All";
      collapseBtn.style.cssText = "font-size:11px;padding:4px 12px;height:28px";
      toolbar.appendChild(expandBtn);
      toolbar.appendChild(collapseBtn);
      card.appendChild(toolbar);
    }

    var t = document.createElement("table");
    t.className = "dt";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    // Build visible column headers (skip _ metadata columns)
    var visibleCols = [];
    data.column_names.forEach(function(c, ci){
      if (c.startsWith("_")) return;
      visibleCols.push({name: c, idx: ci});
      var th = document.createElement("th");
      th.textContent = c;
      if (visibleCols.length === 1) th.className = "col-left";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);

    var tbody = document.createElement("tbody");
    var allRows = [];
    data.rows.forEach(function(row, rowIdx) {
      var tr = document.createElement("tr");
      var rowClass = rowClassCol >= 0 && row[rowClassCol] ? row[rowClassCol] : "";
      var depth = depthCol >= 0 ? (Number(row[depthCol]) || 0) : 0;
      var isSection = rowClass && rowClass !== "row-account" && rowClass !== "row-stat";
      if (rowClass) tr.className = rowClass;
      tr.setAttribute("data-depth", depth);
      tr.setAttribute("data-row-idx", rowIdx);

      visibleCols.forEach(function(vc, vcIdx) {
        var cell = row[vc.idx];
        var td = document.createElement("td");
        var cf = colFmt[vc.name];
        if (vcIdx === 0) {
          td.className = "col-left";
          td.classList.add("indent-" + Math.min(depth, 7));
          // Add expand/collapse icon for section rows
          if (hasHierarchy && isSection) {
            var icon = document.createElement("span");
            icon.className = "expand-icon";
            icon.textContent = "▼";
            icon.style.cursor = "pointer";
            td.insertBefore(icon, td.firstChild);
            tr.classList.add("expandable");
          }
        }
        if (cell !== null && cell !== undefined) {
          var num = Number(cell);
          if (!isNaN(num) && String(cell).match(/^-?\d/)) {
            td.className += " col-number";
            // Variance coloring for negative amounts on section rows
            if (isSection && num < 0) td.classList.add("col-variance-unfav");
            td.textContent = cf ? fmtNum(num, cf.format || cf, cf.prefix, cf.suffix) : fmtCurrency(num, "$");
          } else {
            if (vcIdx === 0 && hasHierarchy && isSection) {
              td.appendChild(document.createTextNode(String(cell)));
            } else {
              td.textContent = String(cell);
            }
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
      allRows.push({tr: tr, depth: depth, isSection: isSection, rowIdx: rowIdx});
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    card.appendChild(wrap);

    // Expand/collapse logic
    if (hasHierarchy) {
      allRows.forEach(function(r) {
        if (r.isSection) {
          r.tr.addEventListener("click", function() {
            var expanded = r.tr.getAttribute("data-expanded") !== "false";
            r.tr.setAttribute("data-expanded", expanded ? "false" : "true");
            var icon = r.tr.querySelector(".expand-icon");
            if (icon) icon.textContent = expanded ? "▶" : "▼";
            // Toggle children: hide/show all rows between this section and
            // the next row at the same or lesser depth
            var hiding = expanded;
            for (var i = r.rowIdx + 1; i < allRows.length; i++) {
              if (allRows[i].depth <= r.depth) break;
              allRows[i].tr.classList.toggle("hidden", hiding);
            }
          });
        }
      });
      expandBtn.addEventListener("click", function() {
        allRows.forEach(function(r) {
          r.tr.classList.remove("hidden");
          r.tr.setAttribute("data-expanded", "true");
          var icon = r.tr.querySelector(".expand-icon");
          if (icon) icon.textContent = "▼";
        });
      });
      collapseBtn.addEventListener("click", function() {
        allRows.forEach(function(r) {
          if (r.depth > 0) r.tr.classList.add("hidden");
          if (r.isSection) {
            r.tr.setAttribute("data-expanded", "false");
            var icon = r.tr.querySelector(".expand-icon");
            if (icon) icon.textContent = "▶";
          }
        });
      });
    }

    // Drill-down: if chart has detail_query, clicking an account row
    // opens a detail panel with transaction-level data
    if (ch.detail_query) {
      allRows.forEach(function(r) {
        if (!r.isSection) {
          r.tr.style.cursor = "pointer";
          r.tr.addEventListener("click", function() {
            var acctName = data.rows[r.rowIdx][visibleCols[0].idx];
            var detailUrl = buildQueryUrl(ch.detail_query) + "&account=" + encodeURIComponent(acctName);
            fetch(detailUrl)
              .then(function(resp){return resp.json();})
              .then(function(detail){
                openDrillDown("Detail: " + acctName, detail);
              });
          });
        }
      });
    }
  };

  // P&L Matrix: Account × Month grid with frozen first column
  domRenderers.pl_matrix = function(card, ch, data) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.style.maxHeight = ch.height ? ch.height + "px" : "70vh";
    if (!data.rows.length){wrap.innerHTML='<div class="error">No data</div>';card.appendChild(wrap);return;}
    var colFmt = ch.columns || {};
    var rowClassCol = data.column_names.indexOf("_row_class");
    var depthCol = data.column_names.indexOf("_depth");
    // Detect month columns (anything that's not the first col or metadata)
    var accountCol = 0;
    var monthCols = [];
    data.column_names.forEach(function(c, ci) {
      if (c.startsWith("_")) return;
      if (ci === accountCol) return;
      monthCols.push({name: c, idx: ci});
    });

    var t = document.createElement("table");
    t.className = "dt dashboard-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    var thAcct = document.createElement("th");
    thAcct.className = "col-account col-left";
    thAcct.textContent = data.column_names[accountCol];
    hr.appendChild(thAcct);
    monthCols.forEach(function(mc, mi) {
      var th = document.createElement("th");
      th.className = mi === monthCols.length - 1 ? "col-total" : "col-month";
      th.textContent = mc.name;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);

    var tbody = document.createElement("tbody");
    data.rows.forEach(function(row) {
      var tr = document.createElement("tr");
      var rowClass = rowClassCol >= 0 && row[rowClassCol] ? row[rowClassCol] : "row-account";
      var depth = depthCol >= 0 ? (Number(row[depthCol]) || 0) : 0;
      tr.className = rowClass;

      // Account name (frozen)
      var tdAcct = document.createElement("td");
      tdAcct.className = "col-account col-left indent-" + Math.min(depth, 7);
      tdAcct.textContent = String(row[accountCol] || "");
      tr.appendChild(tdAcct);

      // Month values
      monthCols.forEach(function(mc, mi) {
        var td = document.createElement("td");
        td.className = mi === monthCols.length - 1 ? "col-total" : "col-number";
        var val = row[mc.idx];
        if (val !== null && val !== undefined) {
          var num = Number(val);
          if (!isNaN(num)) {
            td.textContent = fmtCurrency(num, "$");
          } else {
            td.textContent = String(val);
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    card.appendChild(wrap);
  };

  domRenderers.pivot = function(card, ch, data) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    if (!data.rows.length||!ch.rows||!ch.values){domRenderers.table(card,ch,data);return;}
    var ri = ch.rows.map(function(f){return col(data,f);});
    var vi = ch.values.map(function(f){return col(data,f);});
    var groups = {};
    data.rows.forEach(function(row) {
      var key = ri.map(function(i){return row[i];}).join("|||");
      if(!groups[key]) groups[key]={labels:ri.map(function(i){return row[i];}), values:vi.map(function(){return 0;})};
      vi.forEach(function(v,j){groups[key].values[j]+=Number(row[v])||0;});
    });
    var t = document.createElement("table");
    t.className = "dt";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ch.rows.forEach(function(f){var th=document.createElement("th");th.textContent=f;th.className="col-left";hr.appendChild(th);});
    ch.values.forEach(function(f){var th=document.createElement("th");th.textContent=f;hr.appendChild(th);});
    thead.appendChild(hr);
    t.appendChild(thead);
    var tbody = document.createElement("tbody");
    Object.keys(groups).sort().forEach(function(key) {
      var g=groups[key]; var tr=document.createElement("tr");
      g.labels.forEach(function(l){var td=document.createElement("td");td.className="col-left";td.textContent=String(l);tr.appendChild(td);});
      g.values.forEach(function(v){var td=document.createElement("td");td.className="col-number";td.textContent=v.toLocaleString(undefined,{maximumFractionDigits:2});tr.appendChild(td);});
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    card.appendChild(wrap);
  };

  domRenderers.variance_table = function(card, ch, data) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    if (!data.rows.length){wrap.innerHTML='<div class="error">No data</div>';card.appendChild(wrap);return;}
    var joinCol = ch.join_on;
    var valCol = ch.value || "amount";
    var fmt = ch.format;
    var prefix = ch.prefix || "";
    var suffix = ch.suffix || "";
    var favorable = ch.favorable || "positive";
    var ji = col(data, joinCol), vi = col(data, valCol);
    if (ji<0||vi<0){wrap.innerHTML='<div class="error">Column not found: '+joinCol+' or '+valCol+'</div>';card.appendChild(wrap);return;}
    var compareMap = {};
    if (data.compare && data.compare.rows) {
      var cji = data.compare.column_names.indexOf(joinCol);
      var cvi = data.compare.column_names.indexOf(valCol);
      if (cji >= 0 && cvi >= 0) data.compare.rows.forEach(function(r){compareMap[r[cji]]=Number(r[cvi])||0;});
    }
    var t = document.createElement("table");
    t.className = "dt";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    [joinCol, "Actual", "Budget", "Variance $", "Variance %"].forEach(function(h,i){
      var th = document.createElement("th");
      th.textContent = h;
      if (i === 0) th.className = "col-left";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);
    var tbody = document.createElement("tbody");
    data.rows.forEach(function(row) {
      var key = row[ji];
      var actual = Number(row[vi])||0;
      var budget = compareMap[key]||0;
      var delta = actual - budget;
      var pct = budget !== 0 ? (delta/Math.abs(budget))*100 : 0;
      var isFav = (favorable === "positive") ? delta >= 0 : delta <= 0;
      var tr = document.createElement("tr");
      var tdKey = document.createElement("td");
      tdKey.className = "col-left";
      tdKey.textContent = String(key);
      tr.appendChild(tdKey);
      [actual, budget, delta].forEach(function(v,i) {
        var td = document.createElement("td");
        td.className = "col-number" + (i === 2 ? (isFav ? " col-variance-fav" : " col-variance-unfav") : "");
        td.textContent = fmtNum(v, fmt, prefix, suffix);
        tr.appendChild(td);
      });
      var tdPct = document.createElement("td");
      tdPct.className = "col-number " + (isFav ? "col-variance-fav" : "col-variance-unfav");
      tdPct.textContent = (delta >= 0 ? "+" : "") + pct.toFixed(1) + "%";
      tr.appendChild(tdPct);
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    card.appendChild(wrap);
  };

  domRenderers.custom = function(card, ch, data) {
    var container = document.createElement("div");
    container.style.width = "100%";
    container.style.minHeight = "360px";
    if (ch.height) container.style.minHeight = ch.height + "px";
    container.style.padding = "8px";
    card.appendChild(container);
    if (!ch.vega_lite || typeof vegaEmbed === "undefined") {
      container.innerHTML = '<div class="error">Vega-Lite spec required or library not loaded</div>';
      return;
    }
    var spec = JSON.parse(JSON.stringify(ch.vega_lite));
    spec["$schema"] = spec["$schema"] || "https://vega.github.io/schema/vega-lite/v5.json";
    var values = data.rows.map(function(row) {
      var obj = {};
      data.column_names.forEach(function(c, i) {
        var v = row[i]; var num = Number(v);
        obj[c] = (v !== null && !isNaN(num) && String(v).match(/^-?\d/)) ? num : v;
      });
      return obj;
    });
    spec.data = {values:values};
    if (!spec.width) spec.width = "container";
    if (!spec.height && ch.height) spec.height = ch.height - 40;
    vegaEmbed(container, spec, {actions:false, renderer:"svg"}).catch(function(err) {
      container.innerHTML = '<div class="error">Vega-Lite error: ' + err.message + '</div>';
    });
  };

  // === Excel export (styled with ExcelJS) ===
  function exportExcel(ch, data) {
    if (!data || !data.rows || !data.rows.length) return;
    var wb = new ExcelJS.Workbook();
    var ws = wb.addWorksheet(ch.title || "Data");

    // Visible columns (skip _ metadata)
    var visCols = [];
    data.column_names.forEach(function(c, ci) {
      if (!c.startsWith("_")) visCols.push({name: c, idx: ci});
    });

    // Header row
    var headerRow = ws.addRow(visCols.map(function(vc){return vc.name;}));
    headerRow.font = {bold: true, color: {argb: "FFFFFFFF"}, size: 10};
    headerRow.fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FF1E3A8A"}};
    headerRow.alignment = {horizontal: "center"};
    headerRow.height = 24;

    // Data rows
    data.rows.forEach(function(row) {
      var rowData = visCols.map(function(vc) {
        var v = row[vc.idx];
        if (v === null || v === undefined) return "";
        var num = Number(v);
        return (!isNaN(num) && String(v).match(/^-?\d/)) ? num : String(v);
      });
      var r = ws.addRow(rowData);
      // Row class coloring
      var rcCol = data.column_names.indexOf("_row_class");
      var rc = rcCol >= 0 ? row[rcCol] : "";
      if (rc === "row-level5") { r.font = {bold:true, color:{argb:"FFFFFFFF"}}; r.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF1E3A8A"}}; }
      else if (rc === "row-level4") { r.font = {bold:true, color:{argb:"FFFFFFFF"}}; r.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF2563EB"}}; }
      else if (rc === "row-level3") { r.font = {bold:true, color:{argb:"FFFFFFFF"}}; r.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF3B82F6"}}; }
      else if (rc === "row-ebitda") { r.font = {bold:true, color:{argb:"FFFFFFFF"}}; r.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF059669"}}; }
      else if (rc === "row-netincome") { r.font = {bold:true, color:{argb:"FFFFFFFF"}}; r.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF0891B2"}}; }
    });

    // Column widths
    visCols.forEach(function(vc, i) {
      var col = ws.getColumn(i + 1);
      col.width = i === 0 ? 35 : 16;
      if (i > 0) col.numFmt = "#,##0.00";
    });

    // Freeze header row + first column
    ws.views = [{state: "frozen", xSplit: 1, ySplit: 1}];

    // Download
    wb.xlsx.writeBuffer().then(function(buf) {
      var blob = new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = (ch.title || "export").replace(/[^a-zA-Z0-9]/g, "_") + ".xlsx";
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  // === Drill-down panel ===
  var drillPanel = null;
  function openDrillDown(title, data) {
    if (!drillPanel) {
      drillPanel = document.createElement("div");
      drillPanel.className = "drill-panel";
      drillPanel.innerHTML = '<div class="drill-panel-header"><h3 id="drill-title"></h3><button class="drill-panel-close">&times;</button></div><div class="drill-panel-body" id="drill-body"></div>';
      document.body.appendChild(drillPanel);
      drillPanel.querySelector(".drill-panel-close").addEventListener("click", function(){
        drillPanel.classList.remove("open");
      });
    }
    drillPanel.querySelector("#drill-title").textContent = title;
    var body = drillPanel.querySelector("#drill-body");
    body.innerHTML = "";
    if (!data || !data.rows || !data.rows.length) {
      body.innerHTML = '<div class="error" style="margin:16px">No detail data available</div>';
    } else {
      var t = document.createElement("table");
      t.className = "dt";
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      data.column_names.forEach(function(c){ var th=document.createElement("th"); th.textContent=c; hr.appendChild(th); });
      thead.appendChild(hr); t.appendChild(thead);
      var tbody = document.createElement("tbody");
      data.rows.slice(0, 200).forEach(function(row){
        var tr = document.createElement("tr");
        row.forEach(function(cell, ci){
          var td = document.createElement("td");
          if (cell !== null && cell !== undefined) {
            var num = Number(cell);
            if (!isNaN(num) && String(cell).match(/^-?\d/)) { td.className="col-number"; td.textContent=fmtCurrency(num,"$"); }
            else td.textContent = String(cell);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      t.appendChild(tbody);
      body.appendChild(t);
      if (data.rows.length > 200) {
        var more = document.createElement("div");
        more.style.cssText = "padding:8px 12px;font-size:11px;color:#6b7280;text-align:center";
        more.textContent = "Showing 200 of " + data.rows.length + " rows";
        body.appendChild(more);
      }
    }
    drillPanel.classList.add("open");
  }

  // === EBITDA Bridge (waterfall) chart builder ===
  ecBuilders.bridge = function(ec, ch, data) {
    var labelCol = col(data, ch.x || ch.label || data.column_names[0]);
    var valueCol = col(data, ch.y || ch.value || data.column_names[1]);
    if (labelCol < 0 || valueCol < 0) return;

    var labels = [], values = [], colors = [];
    var cumulative = 0;
    data.rows.forEach(function(row, i) {
      var label = String(row[labelCol]);
      var val = Number(row[valueCol]) || 0;
      labels.push(label);
      values.push(val);
      colors.push(val >= 0 ? "#2563eb" : "#f97316");
      cumulative += val;
    });

    // Build waterfall data: [invisible_base, visible_bar]
    var base = [], visible = [];
    var running = 0;
    values.forEach(function(v, i) {
      if (v >= 0) { base.push(running); visible.push(v); }
      else { base.push(running + v); visible.push(Math.abs(v)); }
      running += v;
    });
    // Add total bar
    labels.push("Total");
    base.push(0);
    visible.push(running);
    colors.push(running >= 0 ? "#059669" : "#dc2626");

    ec.setOption({
      tooltip: {trigger:"axis", axisPointer:{type:"shadow"}, backgroundColor:"#1f2937", borderColor:"#1f2937", textStyle:{color:"#f9fafb"},
        formatter: function(p) { var v=p[1]; return v.name + ": " + fmtCurrency(v.value, "$"); }
      },
      xAxis: {type:"category", data:labels, axisLabel:{rotate:labels.length>6?35:0, fontSize:11, color:"#6b7280"}},
      yAxis: {type:"value", axisLabel:{fontSize:11, formatter:fmtAxis, color:"#6b7280"}, splitLine:{lineStyle:{color:"#f3f4f6"}}},
      series: [
        {name:"base", type:"bar", stack:"waterfall", itemStyle:{color:"transparent"}, emphasis:{itemStyle:{color:"transparent"}}, data:base},
        {name:"value", type:"bar", stack:"waterfall", data:visible.map(function(v,i){return{value:v,itemStyle:{color:colors[i]}};})},
      ],
      grid:{left:70, right:16, top:16, bottom:labels.length>6?60:36}
    });
  };

  window.addEventListener("resize", function(){echartInstances.forEach(function(ec){ec.resize();});});
  setInterval(function(){if(dashSpec)loadAll(dashSpec);}, 30000);
  init();
})();
</script>
